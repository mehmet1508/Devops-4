apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-4
  labels:
    app: devops-4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-4
  template:
    metadata:
      name: devops-4
      labels:
        app: devops-4
    spec:
      containers:
        - name: devops-4
          image: mkerem1508/devops-4:latest
          ports:
            - containerPort: 8080


      